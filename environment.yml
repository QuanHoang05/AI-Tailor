  - pip:
      - smplx==0.1.28
      - yacs
      - tensorboardx
      - filterpy
      - chumpy
      - trimesh
      - pyrender
      - json_tricks
      - torchgeometry
      - einops
      - boto3
      - plyfile
      - timm==0.6.13
      - pyglet
      - yapf==0.40.1
      - loguru
      - scipy==1.10.1
      - scikit-image
      - scikit-learn
      - opencv-python==4.8.0.76
      - pyyaml
      - tqdm
      - matplotlib
      - matplotlib-inline
      - easydict
      - pycocotools
      - joblib
      - numba
