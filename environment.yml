  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip<24.1
  - setuptools==65.5.1
  - wheel
  - cython<3.0.0
  - numpy=1.23.5
  - pytorch=2.0.1
  - torchvision=0.15.2
